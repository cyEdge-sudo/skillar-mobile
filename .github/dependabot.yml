version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    groups:
      expo-react-native-compatible:
        patterns:
          - 'expo*'
          - 'react-native*'
          - '@react-native/*'
          - '@react-navigation/*'
          - 'react*'
        update-types:
          - patch
          - minor
