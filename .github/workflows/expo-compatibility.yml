name: Expo Compatibility

on:
  push:
    branches:
      - main
      - "feature/expo-compatible-mainline"
    paths:
      - package.json
      - package-lock.json
      - app.json
      - "app.config.*"
      - eas.json
      - "babel.config.*"
      - "metro.config.*"
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - app.json
      - "app.config.*"
      - eas.json
      - "babel.config.*"
      - "metro.config.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expo-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Expo SDK compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Expo SDK dependency versions
        run: npx expo install --check

      - name: Run Expo Doctor
        run: npx expo-doctor
