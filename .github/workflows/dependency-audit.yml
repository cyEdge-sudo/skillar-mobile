name: Dependency Security Audit

on:
  workflow_dispatch:
  push:
    branches:
      - "security/**"
  pull_request:
    branches:
      - main
      - "feature/**"
      - "security/**"
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write

jobs:
  audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile for security overrides
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/security/')
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Commit refreshed lockfile
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/security/')
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(security): refresh dependency lockfile"
          git push

      - name: Install locked dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --json > npm-audit.json
        continue-on-error: true

      - name: Summarize audit result
        if: always()
        run: |
          if [ ! -s npm-audit.json ]; then
            echo "npm audit did not produce a report." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            const counts = report.metadata?.vulnerabilities;
            if (!counts) {
              console.error("Audit report has no vulnerability metadata.");
              process.exit(1);
            }
            const lines = [
              "## npm audit",
              "",
              "| Severity | Count |",
              "| --- | ---: |",
              ...Object.entries(counts).filter(([key]) => key !== "total").map(([key, value]) => "| " + key + " | " + value + " |"),
              "| **Total** | **" + counts.total + "** |"
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\\n") + "\\n");
            console.log(lines.join("\\n"));
          '

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce vulnerability policy
        if: always()
        run: |
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            const counts = report.metadata?.vulnerabilities;
            if (!counts) process.exit(1);
            const findings = Object.values(report.vulnerabilities ?? {});
            const accepted = findings.filter((item) =>
              item.name === "deepmerge" &&
              item.severity === "low" &&
              (item.nodes ?? []).every((node) => node === "node_modules/deepmerge")
            );
            const rejected = findings.filter((item) => !accepted.includes(item));
            if (rejected.length > 0 || accepted.length > 1 ||
                counts.moderate > 0 || counts.high > 0 || counts.critical > 0) {
              console.error("Unaccepted dependency vulnerabilities:", JSON.stringify(rejected, null, 2));
              process.exit(1);
            }
            if (accepted.length > 0) {
              console.warn("Accepted low-severity build-tool exception: deepmerge (GHSA-gcqx-w48m-w2h4).");
            }
          '
