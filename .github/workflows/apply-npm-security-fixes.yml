name: Apply Safe Dependency Fixes

on:
  push:
    branches:
      - "security/dependency-remediation"

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.event.head_commit.message != 'chore(security): apply safe npm audit fixes'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply non-breaking audit fixes
        run: npm audit fix --package-lock-only

      - name: Verify installation
        run: npm ci

      - name: Commit updated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No semver-compatible lockfile updates are available."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(security): apply safe npm audit fixes"
          git push
