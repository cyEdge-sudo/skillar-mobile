name: Temporary formatting baseline

on:
  push:
    branches:
      - chore/architecture-dry-cleanup
    paths-ignore:
      - .github/workflows/temporary-format.yml

permissions:
  contents: write
  workflows: write

concurrency:
  group: temporary-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chore/architecture-dry-cleanup
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply repository Prettier configuration
        run: npx prettier . --write
      - name: Commit formatting baseline
        run: |
          if git diff --quiet; then
            echo "No formatting changes are required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply repository Prettier formatting"
          git push origin HEAD:chore/architecture-dry-cleanup
