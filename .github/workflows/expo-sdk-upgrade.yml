name: Expo SDK 58 Upgrade

on:
  push:
    branches:
      - "upgrade/expo-sdk-58"

permissions:
  contents: write

concurrency:
  group: expo-sdk-58-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    name: Upgrade SDK and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Upgrade Expo SDK
        run: |
          npm install expo@^58.0.0
          npx expo install --fix

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: Install required icon font dependency
        run: npx expo install expo-font

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Install exact lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const report = require("./npm-audit.json"); const critical = report.metadata?.vulnerabilities?.critical ?? 0; console.log(JSON.stringify(report.metadata?.vulnerabilities ?? {}, null, 2)); if (critical > 0) process.exit(1);'

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-58-npm-audit
          path: npm-audit.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit SDK dependency updates
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes were generated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(expo): upgrade to SDK 58"
          git push
